plugins {
    id 'java'
}

group = 'com.enchant'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    // Используем только лоадер, чтобы Gradle не искал тяжелые серверные файлы Minecraft вручную
    implementation 'net.fabricmc:fabric-loader:0.14.21'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
